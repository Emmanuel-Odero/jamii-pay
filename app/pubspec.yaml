name: jamiipay
description: JamiiPay — Flutter app (Android, iOS, web dashboard).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  freezed_annotation: ^2.4.4
  go_router: ^14.2.0
  intl: ^0.19.0
  http: ^1.2.2
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  flutter_svg: ^2.0.10+1
  qr_flutter: ^4.1.0
  share_plus: ^10.1.2
  local_auth: ^2.3.0
  crypto: ^3.0.5
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  wallet_core:
    path: rust_builder
  zxing_lib: ^1.1.4
  image: ^4.9.2
  web_socket_channel: ^3.0.1
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_secure_storage_platform_interface: ^1.1.0
  shared_preferences_platform_interface: ^2.4.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
  # Bundled typefaces — offline-first by design (cheap phones, patchy
  # data): no runtime fetch, no first-paint FOUT. Fetched once from
  # Google Fonts as static TTFs via tool/fetch_fonts.py; re-run that
  # script if weights ever need updating.
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

flutter_launcher_icons:
  ios: true
  android: false
  image_path: "assets/branding/app_icon_1024.png"
  remove_alpha_ios: true
