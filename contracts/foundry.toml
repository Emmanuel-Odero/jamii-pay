[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true

# Base mainnet/sepolia RPC aliases used by scripts and the local Anvil-fork
# simulator (see ../docker/docker-compose.yml).
[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
local = "http://127.0.0.1:8545"

[fuzz]
runs = 256
